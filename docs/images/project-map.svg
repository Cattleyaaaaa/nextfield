      <stop stop-color="#0B252B"/><stop offset="1" stop-color="#123940"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB" filterUnits="objectBoundingBox">
