  <text x="126" y="126" fill="#9DE5E2" font-size="16" font-weight="700" class="mono">NEXTFIELD / PROJECT MAP</text>
  <text x="126" y="194" fill="#F2F6F3" font-size="42" font-weight="650" class="sans">A personal site, built as a field of ideas.</text>
