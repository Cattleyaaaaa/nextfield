    <text x="830" y="454" fill="#718789" font-size="14" class="mono">/gallery   /gallery/radio   /live-studio</text>
    <circle cx="1372" cy="372" r="26" stroke="#5ABAB5" stroke-width="2" opacity=".8"/>
